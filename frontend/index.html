<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CI/CD Full Stack App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background: #f4f4f4;
        }

        .container {
            background: white;
            padding: 40px;
            max-width: 600px;
            margin: auto;
            border-radius: 10px;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
        }

        #response {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>CI/CD Full Stack Application</h1>

        <p>Frontend is running successfully.</p>

        <button onclick="getBackendMessage()">
            Test Backend
        </button>

        <div id="response"></div>

    </div>

    <script>
        async function getBackendMessage() {
            try {
                const response = await fetch("/api/message");

                const data = await response.json();

                document.getElementById("response").innerText =
                    data.message;

            } catch (error) {
                document.getElementById("response").innerText =
                    "Backend connection failed.";
            }
        }
    </script>

</body>
</html>
